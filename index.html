<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видеотитор — видеоуроки по школьной программе</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  /* Фон в клеточку */
  body { 
    font-family: 'Rubik', Arial, sans-serif; 
    background-color: #fcfcfc;
    background-image: 
      linear-gradient(#e5e5e5 1px, transparent 1px),
      linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
    background-size: 24px 24px;
    color: #222222; 
    line-height: 1.6; 
    font-size: 17px; 
  }

  /* Красная линия на полях */
  body::before {
    content: '';
    position: fixed;
    top: 0; bottom: 0; left: 20px;
    width: 2px;
    background-color: #ffb3b3;
    z-index: -1;
  }

  header { border-bottom: 2px dashed #b3b3b3; background: rgba(247, 247, 247, 0.9); position: relative; }
  .header-inner { max-width: 900px; margin: 0 auto; padding: 16px 20px; padding-left: 40px; }
  .logo { font-size: 24px; font-weight: 700; color: #1a4d8f; transform: rotate(-1deg); display: inline-block; }
  .header-note { font-size: 15px; color: #555555; margin-top: 2px; font-style: italic; }
  
  main { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px 40px; position: relative; }
  
  /* Заголовки и стрелки */
  .title-wrap { position: relative; margin-bottom: 24px; }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; color: #111; transform: rotate(-1deg); display: inline-block; }
  
  /* Векторная стрелка, нарисованная на фоне */
  .hand-arrow {
    position: absolute;
    width: 80px;
    height: 60px;
    fill: none;
    stroke: #1a4d8f;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .arrow-to-input {
    top: 10px;
    left: 320px;
    transform: rotate(15deg);
  }

  .intro-text { font-size: 17px; color: #444; margin-bottom: 20px; }

  /* Блок формы (выглядит как наклейка) */
  .form-block { 
    border: 2px solid #333; 
    border-radius: 8px; 
    padding: 24px; 
    margin-bottom: 36px; 
    background: #ffffff; 
    box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
    position: relative;
    transform: rotate(0.5deg);
  }
  
  /* Векторная стрелка к кнопке */
  .arrow-to-button {
    bottom: -50px;
    right: 20px;
    transform: rotate(-120deg) scale(1.2);
  }

  .form-line { margin-bottom: 20px; }
  .form-line:last-child { margin-bottom: 0; }
  label { display: block; font-size: 16px; font-weight: 700; margin-bottom: 6px; color: #1a4d8f; }
  input[type="text"], select { 
    font-family: inherit; 
    font-size: 17px; 
    color: #222; 
    background: #fdfdfd; 
    border: 1px solid #777; 
    border-radius: 4px; 
    padding: 12px 14px; 
    width: 100%; 
    outline: none; 
    box-shadow: inset 1px 1px 3px rgba(0,0,0,0.1);
  }
  input[type="text"]:focus, select:focus { border-color: #1a4d8f; background: #fff; }
  
  .two-columns { display: flex; gap: 18px; flex-wrap: wrap; }
  .two-columns > div { flex: 1; min-width: 200px; }
  
  .source-options { display: flex; gap: 24px; padding-top: 4px; }
  .source-options label { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: 17px; cursor: pointer; margin-bottom: 0; color: #222; }
  .source-options input[type="radio"] { width: 18px; height: 18px; cursor: pointer; accent-color: #1a4d8f; }
  
  button.find { 
    font-family: inherit; 
    font-size: 18px; 
    font-weight: 700; 
    color: #ffffff; 
    background: #1a4d8f; 
    border: 2px solid #143c70; 
    border-radius: 6px; 
    padding: 14px 20px; 
    cursor: pointer; 
    width: 100%; 
    box-shadow: 3px 3px 0px #111;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button.find:hover { background: #143c70; }
  button.find:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #111; }
  button.find:disabled { background: #8fa9c9; cursor: wait; box-shadow: none; transform: none; }

  .message { border: 2px dashed #777; border-radius: 8px; padding: 20px; text-align: center; font-size: 17px; color: #555; background: rgba(255,255,255,0.8); }
  
  .section-title { 
    font-size: 22px; 
    font-weight: 700; 
    margin: 30px 0 16px; 
    color: #1a4d8f; 
    border-bottom: 2px solid #333; 
    padding-bottom: 6px; 
    display: inline-block;
    transform: rotate(-1deg);
  }
  
  .video-list { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); margin-bottom: 20px; }
  
  /* Карточки видео (как будто наклеены в тетрадь) */
  .video-card { 
    border: 2px solid #444; 
    border-radius: 4px; 
    overflow: hidden; 
    cursor: pointer; 
    background: #fff; 
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
    transform: rotate(-0.5deg);
  }
  .video-card:nth-child(even) { transform: rotate(0.5deg); }
  .video-card:hover { transform: translateY(-2px) rotate(0deg); box-shadow: 4px 4px 0px rgba(26, 77, 143, 0.3); border-color: #1a4d8f; }
  .video-card .preview { width: 100%; aspect-ratio: 16/9; background: #e8e8e8; display: block; object-fit: cover; border-bottom: 2px dashed #ccc; }
  .video-card .info { padding: 12px 14px; }
  .video-card .name { font-size: 16px; font-weight: 700; line-height: 1.4; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.8em; color: #222; }
  .video-card .author { font-size: 14px; color: #666; font-style: italic; }

  /* Окно плеера */
  .window { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .window.open { display: flex; }
  .window-box { width: 100%; max-width: 860px; }
  .window-video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .window-video iframe { width: 100%; height: 100%; border: none; display: block; }
  .window-footer { background: #fff; border-radius: 6px; padding: 12px 16px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border: 2px solid #444; }
  .window-title { font-size: 16px; font-weight: 700; flex: 1; min-width: 150px; }
  .window-link { font-size: 15px; color: #1a4d8f; text-decoration: none; font-weight: 700; }
  .window-link:hover { text-decoration: underline; }
  .window-close { font-family: inherit; font-size: 16px; font-weight: 700; color: #222; background: #eee; border: 2px solid #444; border-radius: 4px; padding: 6px 14px; cursor: pointer; }
  .window-close:hover { background: #ddd; }

  /* Окно предупреждения о VPN */
  .vpn-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 200; }
  .vpn-modal.open { display: flex; }
  .vpn-box { background: #fff; border-radius: 8px; max-width: 420px; width: 100%; padding: 26px; box-shadow: 6px 6px 0px rgba(0,0,0,0.2); border: 2px solid #333; transform: rotate(1deg); }
  .vpn-box h3 { font-size: 20px; font-weight: 700; margin-bottom: 12px; color: #1a4d8f; }
  .vpn-box p { font-size: 16px; color: #333; margin-bottom: 24px; }
  .vpn-buttons { display: flex; gap: 12px; justify-content: flex-end; }
  .vpn-buttons button { font-family: inherit; font-size: 16px; font-weight: 700; padding: 10px 20px; border-radius: 4px; cursor: pointer; border: 2px solid #333; }
  .vpn-buttons .cancel { background: #eee; color: #333; }
  .vpn-buttons .cancel:hover { background: #ddd; }
  .vpn-buttons .continue { background: #1a4d8f; color: #fff; border-color: #143c70; }
  .vpn-buttons .continue:hover { background: #143c70; }

  footer { text-align: center; padding: 24px 20px; color: #777; font-size: 15px; border-top: 2px dashed #ccc; font-style: italic; }
  @media (max-width: 520px) { h1 { font-size: 24px; } .source-options { flex-direction: column; gap: 12px; } .arrow-to-input { display: none; } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Видеотитор</div>
    <div class="header-note">Видеоуроки по школьной программе</div>
  </div>
</header>

<main>
  <div class="title-wrap">
    <h1>Поиск видеоуроков</h1>
    
    <!-- Рисованная стрелка, указывающая на ввод текста -->
    <svg class="hand-arrow arrow-to-input" viewBox="0 0 100 80">
      <path d="M 10,70 Q 30,20 80,30 M 60,10 L 85,30 L 55,45" />
    </svg>
  </div>
  
  <p class="intro-text">Введите тему урока, выберите класс и источник видео. Затем нажмите кнопку «Найти видеоуроки».</p>

  <div class="form-block">
    <div class="form-line">
      <label for="topic">Тема урока</label>
      <input id="topic" type="text" placeholder="Например: обыкновенные дроби, фотосинтез" autocomplete="off">
    </div>

    <div class="form-line two-columns">
      <div>
        <label for="grade">Класс</label>
        <select id="grade">
          <option value="">Любой класс</option>
          <option value="1">1 класс</option>
          <option value="2">2 класс</option>
          <option value="3">3 класс</option>
          <option value="4">4 класс</option>
          <option value="5">5 класс</option>
          <option value="6">6 класс</option>
          <option value="7">7 класс</option>
          <option value="8">8 класс</option>
          <option value="9">9 класс</option>
          <option value="10">10 класс</option>
          <option value="11">11 класс</option>
        </select>
      </div>
    </div>

    <div class="form-line">
      <label>Источник видео</label>
      <div class="source-options">
        <label><input type="radio" name="source" value="youtube" checked> YouTube</label>
        <label><input type="radio" name="source" value="rutube"> Rutube</label>
      </div>
    </div>

    <div class="form-line">
      <button class="find" id="go">Найти видеоуроки</button>
      
      <!-- Рисованная стрелка к кнопке -->
      <svg class="hand-arrow arrow-to-button" viewBox="0 0 100 80">
        <path d="M 10,70 Q 30,20 80,30 M 60,10 L 85,30 L 55,45" />
      </svg>
    </div>
  </div>

  <div id="status" class="message">Введите тему урока и нажмите «Найти видеоуроки».</div>
  <div id="results"></div>
</main>

<footer>Видеотитор — видеоуроки для школьников</footer>

<div class="window" id="window">
  <div class="window-box">
    <div class="window-video"><iframe id="frame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe></div>
    <div class="window-footer">
      <div class="window-title" id="windowTitle"></div>
      <a class="window-link" id="openExternal" href="#" target="_blank" rel="noopener">Открыть на сайте</a>
      <button class="window-close" id="closeWindow">Закрыть</button>
    </div>
  </div>
</div>

<div class="vpn-modal" id="vpnModal">
  <div class="vpn-box">
    <h3 id="vpnTitle"></h3>
    <p id="vpnText"></p>
    <div class="vpn-buttons">
      <button class="cancel" id="vpnCancel">Отмена</button>
      <button class="continue" id="vpnContinue">Продолжить</button>
    </div>
  </div>
</div>

<script>
const PROXY = 'https://still-band-05c9.emkasemka04.workers.dev';

const $ = id => document.getElementById(id);
const topicEl = $('topic'), gradeEl = $('grade'), goEl = $('go');
const statusEl = $('status'), resultsEl = $('results');
const windowEl = $('window'), frame = $('frame'), windowTitle = $('windowTitle');
const openExternal = $('openExternal'), closeWindow = $('closeWindow');

const vpnModal = $('vpnModal'), vpnTitle = $('vpnTitle'), vpnText = $('vpnText');
const vpnCancel = $('vpnCancel'), vpnContinue = $('vpnContinue');

function getSource() {
  const checked = document.querySelector('input[name="source"]:checked');
  return checked ? checked.value : 'youtube';
}

function placeholder(text) {
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180">
      <rect width="320" height="180" fill="#e8e8e8"/>
      <text x="160" y="94" font-family="Rubik, Arial" font-size="14" fill="#888888"
        text-anchor="middle">${text}</text></svg>`);
}

function showMessage(text) {
  statusEl.textContent = text;
  statusEl.style.display = 'block';
  resultsEl.innerHTML = '';
}

function createCard(item) {
  const card = document.createElement('div');
  card.className = 'video-card';
  
  const img = document.createElement('img');
  img.className = 'preview'; img.alt = ''; img.loading = 'lazy';
  img.src = item.thumb || placeholder('Видеоурок');
  img.onerror = function () { this.src = placeholder('Нет превью'); };

  const info = document.createElement('div');
  info.className = 'info';
  const name = document.createElement('div');
  name.className = 'name'; name.textContent = item.title;
  const author = document.createElement('div');
  author.className = 'author'; author.textContent = item.channel || '';

  info.appendChild(name); info.appendChild(author);
  card.appendChild(img); card.appendChild(info);
  card.addEventListener('click', () => openVideo(item));
  return card;
}

function renderResults(items) {
  statusEl.style.display = 'none';
  resultsEl.innerHTML = '';

  if (!items || items.length === 0) {
    showMessage('Ничего не нашлось. Попробуйте изменить тему или класс.');
    return;
  }

  const topItems = items.slice(0, 3);
  const otherItems = items.slice(3);

  const topTitle = document.createElement('div');
  topTitle.className = 'section-title';
  topTitle.textContent = 'Лучшие видеоуроки по этой теме';
  resultsEl.appendChild(topTitle);

  const topGrid = document.createElement('div');
  topGrid.className = 'video-list';
  topItems.forEach(item => topGrid.appendChild(createCard(item)));
  resultsEl.appendChild(topGrid);

  if (otherItems.length > 0) {
    const otherTitle = document.createElement('div');
    otherTitle.className = 'section-title';
    otherTitle.textContent = 'Другие видеоуроки';
    resultsEl.appendChild(otherTitle);

    const otherGrid = document.createElement('div');
    otherGrid.className = 'video-list';
    otherItems.forEach(item => otherGrid.appendChild(createCard(item)));
    resultsEl.appendChild(otherGrid);
  }
}

function openVideo(item) {
  if (item.embed) {
    frame.src = item.embed;
    openExternal.href = item.embed;
    openExternal.style.display = 'inline';
  } else {
    frame.src = '';
    openExternal.style.display = 'none';
  }
  windowTitle.textContent = item.title;
  windowEl.classList.add('open');
}

function closeVideo() {
  windowEl.classList.remove('open');
  frame.src = '';
}

closeWindow.addEventListener('click', closeVideo);
windowEl.addEventListener('click', e => { if (e.target === windowEl) closeVideo(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideo(); });

function showVpnWarning(source, callback) {
  if (source === 'youtube') {
    vpnTitle.textContent = 'Внимание: включите VPN';
    vpnText.textContent = 'Для поиска видео на YouTube, пожалуйста, включите VPN. В противном случае поиск может не работать или видео не загрузятся.';
  } else {
    vpnTitle.textContent = 'Внимание: выключите VPN';
    vpnText.textContent = 'Для поиска видео на Rutube, пожалуйста, выключите VPN. Rutube может блокировать запросы с иностранных IP-адресов.';
  }
  
  vpnModal.classList.add('open');

  const onCancel = () => {
    vpnModal.classList.remove('open');
    cleanup();
  };
  
  const onContinue = () => {
    vpnModal.classList.remove('open');
    callback();
    cleanup();
  };

  function cleanup() {
    vpnCancel.removeEventListener('click', onCancel);
    vpnContinue.removeEventListener('click', onContinue);
  }

  vpnCancel.addEventListener('click', onCancel);
  vpnContinue.addEventListener('click', onContinue);
}

async function doSearch() {
  const q = topicEl.value.trim();
  const grade = gradeEl.value;
  const source = getSource();

  goEl.disabled = true;
  goEl.textContent = 'Идёт поиск...';
  showMessage('Загружаем видеоуроки, подождите.');

  try {
    const params = new URLSearchParams({ q, grade, source });
    const resp = await fetch(`${PROXY}/?${params}`);
    const data = await resp.json();

    if (!data.ok) throw new Error(data.error || 'Ошибка при запросе');
    renderResults(data.items);
  } catch (e) {
    showMessage('Не удалось загрузить видео. Причина: ' + e.message);
  } finally {
    goEl.disabled = false;
    goEl.textContent = 'Найти видеоуроки';
  }
}

goEl.addEventListener('click', () => {
  const q = topicEl.value.trim();
  if (!q) {
    showMessage('Введите тему урока. Например: «дроби» или «фотосинтез».');
    topicEl.focus();
    return;
  }
  
  const source = getSource();
  showVpnWarning(source, doSearch);
});

topicEl.addEventListener('keydown', e => { 
  if (e.key === 'Enter') goEl.click(); 
});
</script>
</body>
</html>
